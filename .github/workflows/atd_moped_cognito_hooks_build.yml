#
# Builds Cognito Triggers for Moped Authentication
#
name: "Build & Publish Cognito Hooks"

on:
  push:
    branches:
      - main
      - production
    paths:
      - "auth/cognito-pre-token-hook/**"
      - ".github/workflows/aws-moped-cognito-helper.sh"
      - ".github/workflows/cognito-hooks.yml"
  workflow_dispatch:
    inputs:
      description:
        default: ""

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      # The Lambda target version is set by LAMBDA_PYTHON_VERSION in the helper
      # script; this keeps the runner's Python in line with it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      # AWS CLI v2, jq, and zip are preinstalled on GitHub's Ubuntu runners.
      - name: "Build & Deploy"
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ATD_MOPED_COGNITO_ROLE: ${{ secrets.ATD_MOPED_COGNITO_ROLE }}
        run: |
          export BRANCH_NAME=${GITHUB_REF##*/}
          echo "SHA: ${GITHUB_SHA}"
          echo "ACTION/BRANCH_NAME: ${BRANCH_NAME}"
          echo "GR: ${GITHUB_REF}"
          echo "PWD: $(pwd)"
          aws --version
          source $(pwd)/.github/workflows/aws-moped-cognito-helper.sh
          deploy_cognito_functions