schema:
  - http://localhost:8082/v1/graphql:
      headers:
        x-hasura-admin-secret: hasurapassword

documents:
  - 'src/queries/project.js'
  - 'src/queries/components.js'

generates:
  src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHooks: true
